[package]
name = "autovaxx"
version = "0.1.0"
description = "Local-first immunization documentation foundation"
authors = ["Cuadrado Zayas Infrastructure LLC"]
edition = "2024"
rust-version = "1.88"
license = "Proprietary"

[lib]
name = "autovaxx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["synthetic-only", "dev-auth", "sqlite-bundled"]
synthetic-only = []
dev-auth = ["synthetic-only"]
sqlite-bundled = ["rusqlite/bundled"]
sqlcipher = ["rusqlite/bundled-sqlcipher-vendored-openssl"]
production = ["sqlcipher"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
aes-gcm = "0.10.3"
argon2 = "0.5.3"
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
getrandom = "0.3.4"
rusqlite = { version = "0.40.0", default-features = false, features = ["backup", "chrono", "uuid"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = [] }
tempfile = "3.25.0"
thiserror = "2.0.18"
uuid = { version = "1.21.0", features = ["v4", "serde"] }
zeroize = { version = "1.8.2", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_Memory",
] }

[dev-dependencies]
