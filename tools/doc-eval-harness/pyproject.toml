[project]
name = "autovaxx-doc-eval-harness"
version = "0.1.0"
description = "Synthetic-only local documentation-agent evaluation harness for AutoVaxx"
requires-python = ">=3.12,<3.15"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
]

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autovaxx_doc_harness"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["autovaxx_doc_harness"]
