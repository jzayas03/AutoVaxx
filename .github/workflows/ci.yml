name: Phase 1 quality gates

on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: phase-1-quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  frontend-and-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm policy:check
      - run: pnpm license:check
      - run: pnpm audit --audit-level high

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  rust-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo install cargo-audit --locked
      - run: cargo audit --file src-tauri/Cargo.lock

  windows-foundation:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - run: pnpm install --frozen-lockfile
      - name: Record runner evidence (not Windows 11 acceptance)
        shell: pwsh
        run: |
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber, OsArchitecture
          Get-CimInstance Win32_Processor | Select-Object Name
          Get-CimInstance Win32_ComputerSystem | Select-Object TotalPhysicalMemory
          rustc --version --verbose
          node --version
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --no-default-features --features synthetic-only,sqlcipher,windows-secret-store --all-targets -- -D warnings
      - name: Run encrypted Windows tests serially in release mode
        # The unoptimized MSVC crypto path overflows its test thread; the
        # release profile matches the optimized code shipped by Tauri.
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --no-default-features --features synthetic-only,sqlcipher,windows-secret-store -- --test-threads=1
      - run: cargo check --manifest-path src-tauri/Cargo.toml --no-default-features --features production
      - run: pnpm tauri build --bundles nsis

  required:
    name: Required quality gates
    if: ${{ always() }}
    needs:
      - frontend-and-policy
      - secret-scan
      - rust-macos
      - windows-foundation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every quality gate passed
        if: >-
          ${{
            needs.frontend-and-policy.result != 'success' ||
            needs.secret-scan.result != 'success' ||
            needs.rust-macos.result != 'success' ||
            needs.windows-foundation.result != 'success'
          }}
        run: exit 1
      - run: echo "All required quality gates passed"
